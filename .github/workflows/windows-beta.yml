name: Build Windows Beta Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-beta.yml'
      - 'MQL-Indicator-Library-Repo-Ready.zip'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract clean application source
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "mql-indicator-library-build"
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Expand-Archive -Path "MQL-Indicator-Library-Repo-Ready.zip" -DestinationPath $work -Force
          $app = Get-ChildItem -Path $work -Directory | Select-Object -First 1
          if (-not $app) { throw "Application source folder was not found after extraction." }
          "APP_DIR=$($app.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Application source: $($app.FullName)"

      - name: Harden Windows startup
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR

          $main = @(
            '#![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]'
            'fn main() { mql_indicator_library_lib::run(); }'
          )
          $main | Set-Content -Path "src-tauri/src/main.rs" -Encoding utf8

          $lib = @(
            'use std::fs::OpenOptions;'
            'use std::io::Write;'
            ''
            'fn log_startup_error(message: &str) {'
            '    let path = std::env::temp_dir().join("mql-indicator-library-startup-error.txt");'
            '    if let Ok(mut file) = OpenOptions::new().create(true).append(true).open(path) {'
            '        let _ = writeln!(file, "{}", message);'
            '    }'
            '}'
            ''
            '#[cfg_attr(mobile, tauri::mobile_entry_point)]'
            'pub fn run() {'
            '    std::panic::set_hook(Box::new(|info| {'
            '        log_startup_error(&format!("panic: {}", info));'
            '    }));'
            ''
            '    let result = tauri::Builder::default()'
            '        .plugin(tauri_plugin_dialog::init())'
            '        .plugin(tauri_plugin_shell::init())'
            '        .run(tauri::generate_context!());'
            ''
            '    if let Err(err) = result {'
            '        log_startup_error(&format!("tauri startup error: {}", err));'
            '    }'
            '}'
          )
          $lib | Set-Content -Path "src-tauri/src/lib.rs" -Encoding utf8

          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          $pkg.version = "0.2.0-beta.2"
          $pkg | ConvertTo-Json -Depth 20 | Set-Content "package.json" -Encoding utf8

          (Get-Content "src-tauri/Cargo.toml" -Raw) -replace 'version = "0.2.0-beta.1"','version = "0.2.0-beta.2"' | Set-Content "src-tauri/Cargo.toml" -Encoding utf8

          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $conf.version = "0.2.0-beta.2"
          $conf.identifier = "com.mqlindicatorlibrary.desktop"
          $conf | ConvertTo-Json -Depth 30 | Set-Content "src-tauri/tauri.conf.json" -Encoding utf8

          Write-Host "Prepared Beta 0.2.0-beta.2 hardened Windows startup."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build bundled MQL analysis engine
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements-build.txt
          python -m PyInstaller --noconfirm --clean --onefile --name mql-engine --distpath build-sidecar --workpath build-pyinstaller --specpath build-pyinstaller engine/engine.py
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item build-sidecar/mql-engine.exe src-tauri/binaries/mql-engine-x86_64-pc-windows-msvc.exe -Force

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          npm install

      - name: Ensure Windows application icon
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            python -m pip install pillow
            New-Item -ItemType Directory -Force -Path "src-tauri/icons" | Out-Null
            python -c "from PIL import Image,ImageDraw; from pathlib import Path; p=Path(r'src-tauri/icons/icon.ico'); im=Image.new('RGBA',(256,256),(24,24,27,255)); d=ImageDraw.Draw(im); d.rounded_rectangle((28,28,228,228),radius=44,fill=(37,99,235,255)); d.text((78,92),'MQL',fill=(255,255,255,255)); im.save(p,format='ICO',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          }
          if (-not (Test-Path "src-tauri/icons/icon.ico")) { throw "Windows icon generation failed." }

      - name: Build Windows installer
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          npm run tauri build

      - name: Verify installer
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          $installer = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -ErrorAction Stop | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size MB: $([math]::Round($installer.Length / 1MB, 2))"

      - name: Upload finished Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: MQL-Indicator-Library-0.2.0-beta.2-Windows-Setup
          path: ${{ env.APP_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
