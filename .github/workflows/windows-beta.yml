name: Build Windows Beta Installer
# PR validation sync

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-beta.yml'
      - 'engine.py'
      - 'engine_core.py'
      - 'mql_text.py'
      - 'requirements-build.txt'
      - 'preview_bridge.py'
      - 'preview_control.py'
      - 'nnfx_backtest_batch.py'
      - 'nnfx_engine.py'
      - 'nnfx_selftest.py'
      - 'index.html'
      - 'package.json'
      - 'ui/**'
      - 'src-tauri/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-beta.yml'
      - 'engine.py'
      - 'engine_core.py'
      - 'mql_text.py'
      - 'requirements-build.txt'
      - 'preview_bridge.py'
      - 'preview_control.py'
      - 'nnfx_backtest_batch.py'
      - 'nnfx_engine.py'
      - 'nnfx_selftest.py'
      - 'index.html'
      - 'package.json'
      - 'ui/**'
      - 'src-tauri/**'
      - 'tests/**'

concurrency:
  group: windows-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Stage the Python engine
        shell: pwsh
        run: |
          # P2: the repo IS the Tauri project (ui/, src-tauri/, index.html, package.json); only the Python
          # sidecar sources, which live at the repo root, are staged into engine/ for PyInstaller.
          $r=$env:GITHUB_WORKSPACE
          "APP_DIR=$r" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path "$r/engine" | Out-Null
          foreach($f in 'engine.py','engine_core.py','mql_text.py','requirements-build.txt','preview_bridge.py','preview_control.py','nnfx_backtest_batch.py','nnfx_engine.py','nnfx_selftest.py'){
            Copy-Item "$r/$f" "$r/engine/$f" -Force
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable

      - name: Validate source
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          python -m py_compile engine/engine.py engine/engine_core.py engine/mql_text.py engine/preview_bridge.py engine/preview_control.py engine/nnfx_backtest_batch.py engine/nnfx_engine.py engine/nnfx_selftest.py
          if($LASTEXITCODE -ne 0){throw 'Python source validation failed'}
          python engine/nnfx_selftest.py
          if($LASTEXITCODE -ne 0){throw 'NNFX backtester self-test failed'}
          node --check ui/main.js
          if($LASTEXITCODE -ne 0){throw 'main.js syntax validation failed'}
          node --check ui/preview_ui.js
          if($LASTEXITCODE -ne 0){throw 'preview_ui.js syntax validation failed'}
          # one version source (P2): package.json; tauri.conf.json points at it; Cargo.toml must match
          $packageVersion=(Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion=(Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion=[regex]::Match((Get-Content src-tauri/Cargo.toml -Raw),'(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if($packageVersion -notmatch '^\d+\.\d+\.\d+$' -or $tauriVersion -ne '../package.json' -or $cargoVersion -ne $packageVersion){throw "Version mismatch package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"}
          "APP_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python engine/preview_bridge.py detect
          if($LASTEXITCODE -ne 0){throw 'Preview detector failed'}
          python engine/preview_bridge.py self-test
          if($LASTEXITCODE -ne 0){throw 'Preview self-test failed'}
          # the former source-string assertions are named tests now (tests/test_source_contracts.py)
          python -m unittest discover -s tests
          if($LASTEXITCODE -ne 0){throw 'Unit tests failed'}
          python engine/preview_control.py self-test
          if($LASTEXITCODE -ne 0){throw 'Preview control self-test failed'}

      - name: Build bundled engines
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements-build.txt
          python -m PyInstaller --noconfirm --clean --onefile --name mql-engine --distpath build-sidecar --workpath build-pyinstaller-engine --specpath build-pyinstaller-engine engine/engine.py
          python -m PyInstaller --noconfirm --clean --onefile --name mql-preview --distpath build-sidecar --workpath build-pyinstaller-preview --specpath build-pyinstaller-preview engine/preview_bridge.py
          python -m PyInstaller --noconfirm --clean --onefile --name mql-preview-control --distpath build-sidecar --workpath build-pyinstaller-control --specpath build-pyinstaller-control engine/preview_control.py
          python -m PyInstaller --noconfirm --clean --onefile --name mql-backtest-batch --distpath build-sidecar --workpath build-pyinstaller-backtest-batch --specpath build-pyinstaller-backtest-batch engine/nnfx_backtest_batch.py
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item build-sidecar/mql-engine.exe src-tauri/binaries/mql-engine-x86_64-pc-windows-msvc.exe -Force
          Copy-Item build-sidecar/mql-preview.exe src-tauri/binaries/mql-preview-x86_64-pc-windows-msvc.exe -Force
          Copy-Item build-sidecar/mql-preview-control.exe src-tauri/binaries/mql-preview-control-x86_64-pc-windows-msvc.exe -Force
          Copy-Item build-sidecar/mql-backtest-batch.exe src-tauri/binaries/mql-backtest-batch-x86_64-pc-windows-msvc.exe -Force

      - name: Validate packaged engines
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          $p=& 'build-sidecar/mql-preview.exe' detect 2>&1
          $p | ForEach-Object {Write-Host $_}
          if($LASTEXITCODE -ne 0 -or ($p -join "`n") -notmatch '"ok": true'){throw 'Packaged preview detector failed'}
          $pst=& 'build-sidecar/mql-preview.exe' self-test 2>&1
          $pst | ForEach-Object {Write-Host $_}
          if($LASTEXITCODE -ne 0 -or ($pst -join "`n") -notmatch '"ok": true'){throw 'Packaged preview self-test failed'}
          $c=& 'build-sidecar/mql-preview-control.exe' self-test 2>&1
          $c | ForEach-Object {Write-Host $_}
          if($LASTEXITCODE -ne 0 -or ($c -join "`n") -notmatch '"ok": true'){throw 'Packaged preview control failed'}

          $sample=Join-Path $env:RUNNER_TEMP 'mql-unicode'
          New-Item -ItemType Directory -Force -Path $sample | Out-Null
          '#property indicator_chart_window`nint OnInit(){return(INIT_SUCCEEDED);}' | Set-Content "$sample/Unicode_测试_Δ_é.mq4" -Encoding utf8
          $s=& 'build-sidecar/mql-engine.exe' scan --db "$sample/test.sqlite3" --source $sample 2>&1
          $s | ForEach-Object {Write-Host $_}
          if($LASTEXITCODE -ne 0 -or ($s -join "`n") -notmatch 'scan_complete'){throw 'Packaged scanner validation failed'}

          $clearRoot=Join-Path $env:RUNNER_TEMP 'com.mqlindicatorlibrary.app'
          $outside=Join-Path $env:RUNNER_TEMP 'source-file-must-survive.mq5'
          Remove-Item $clearRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $outside -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$clearRoot/diagnostics" | Out-Null
          '' | Set-Content "$clearRoot/library.sqlite3"
          'diagnostic' | Set-Content "$clearRoot/diagnostics/test.log"
          'source' | Set-Content $outside
          $clear=& 'build-sidecar/mql-preview-control.exe' clear-app --db "$clearRoot/library.sqlite3" 2>&1
          $clear | ForEach-Object {Write-Host $_}
          if($LASTEXITCODE -ne 0 -or ($clear -join "`n") -notmatch '"ok": true'){throw 'Clear application control failed'}
          if((Get-ChildItem $clearRoot -Force | Measure-Object).Count -ne 0){throw 'Clear application left app data behind'}
          if(-not(Test-Path $outside)){throw 'Clear application touched a source file outside app data'}
          $foreign=Join-Path $env:RUNNER_TEMP 'not-the-app-folder'
          New-Item -ItemType Directory -Force -Path $foreign | Out-Null
          'keep' | Set-Content "$foreign/keep.txt"
          $refused=& 'build-sidecar/mql-preview-control.exe' clear-app --db "$foreign/library.sqlite3" 2>&1
          if($LASTEXITCODE -eq 0 -or -not(Test-Path "$foreign/keep.txt")){throw 'Clear application must refuse a folder that is not the app data folder'}
          $global:LASTEXITCODE=0  # the refusal above exits 1 on purpose; GitHub ends the step with 'exit $LASTEXITCODE'

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          npm install

      - name: Ensure icon
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          if(-not(Test-Path 'src-tauri/icons/icon.ico')){
            python -m pip install pillow
            New-Item -ItemType Directory -Force -Path 'src-tauri/icons' | Out-Null
            python -c "from PIL import Image,ImageDraw;from pathlib import Path;p=Path(r'src-tauri/icons/icon.ico');im=Image.new('RGBA',(256,256),(24,24,27,255));d=ImageDraw.Draw(im);d.rounded_rectangle((28,28,228,228),radius=44,fill=(37,99,235,255));d.text((78,92),'MQL',fill=(255,255,255,255));im.save(p,format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          npm run tauri build
          $bundle=(Get-ChildItem dist/assets -Filter '*.js' | Get-Content -Raw) -join "`n"
          if($bundle -notmatch 'Clear Application / Start Fresh'){throw 'Clear application control was not bundled into frontend'}
          if($bundle -match 'Create Archive Backup'){throw 'Archive UI was bundled unexpectedly'}
          if($bundle -notmatch 'mql-preview-control'){throw 'Preview control sidecar was not bundled into frontend'}
          if($bundle -notmatch 'preview_cache_hit'){throw 'Cache-first preview click path was not bundled'}
          if($bundle -notmatch 'preview_queue_update'){throw 'SQLite preview queue controls were not bundled'}
          if($bundle -notmatch 'start_preview_library'){throw 'Background preview library worker launcher was not bundled'}
          if($bundle -notmatch 'ui_event_loop_stall'){throw 'UI stall watchdog was not bundled'}
          if($bundle -notmatch 'preview_library_done_ui'){throw 'Background preview completion handling was not bundled'}
          if($bundle -notmatch 'preview_refresh_queued'){throw 'Explicit preview refresh queueing was not bundled'}
          if($bundle -notmatch 'preview_queue_stats'){throw 'Preview queue progress/statistics were not bundled'}
          if($bundle -notmatch 'preview_worker_pause'){throw 'Preview worker pause/resume control was not bundled'}
          if($bundle -notmatch 'Run preview self-test' -or $bundle -notmatch 'preview-selftest'){throw 'Preview self-test UI was not bundled'}
          if($bundle -match 'preview_scheduled'){throw 'Old synchronous click-preview scheduler was bundled unexpectedly'}

      - name: Frontend readiness smoke test
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          $exe='src-tauri/target/release/mql-indicator-library.exe'
          if(-not(Test-Path $exe)){throw 'Built application executable missing'}
          $startupLog=Join-Path $env:TEMP 'mql-indicator-library-startup-error.txt'
          $appData=Join-Path $env:APPDATA 'com.mqlindicatorlibrary.app'
          $diag=Join-Path $appData 'diagnostics/application.jsonl'
          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          Remove-Item $appData -Recurse -Force -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath $exe -PassThru
          $ready=$false
          # 60 s: a cold WebView2 start on the hosted runner occasionally needed more than 25 s (run 38644966637
          # failed, its re-run of the same commit passed)
          for($i=0;$i -lt 60;$i++){
            Start-Sleep -Seconds 1
            if($p.HasExited){break}
            if(Test-Path $diag){
              $txt=Get-Content $diag -Raw -ErrorAction SilentlyContinue
              if($txt -match '"event"\s*:\s*"app_ready"'){$ready=$true;break}
            }
          }
          if(-not $ready){
            if(Test-Path $startupLog){Write-Host '--- startup log ---';Get-Content $startupLog | ForEach-Object {Write-Host $_}}
            if(Test-Path $diag){Write-Host '--- application diagnostics ---';Get-Content $diag | Select-Object -Last 100 | ForEach-Object {Write-Host $_}}
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force}
            throw 'Frontend never reached app_ready; installer will not be published.'
          }
          Write-Host "Frontend reached app_ready. PID=$($p.Id)"
          Stop-Process -Id $p.Id -Force

      - name: Verify installer
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          $i=Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if(-not $i){throw 'Installer missing'}
          if($i.Name -notmatch [regex]::Escape($env:APP_VERSION)){throw "Wrong installer version: $($i.Name)"}
          if(-not(Test-Path 'src-tauri/binaries/mql-preview-x86_64-pc-windows-msvc.exe')){throw 'Preview sidecar missing'}
          if(-not(Test-Path 'src-tauri/binaries/mql-preview-control-x86_64-pc-windows-msvc.exe')){throw 'Preview control sidecar missing'}
          Write-Host "Installer $($i.FullName)"

      - name: Upload finished Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: MQL-Indicator-Library-${{ env.APP_VERSION }}-Windows-Setup
          path: ${{ env.APP_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
