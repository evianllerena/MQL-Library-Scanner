name: Build Windows Beta Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-beta.yml'
      - 'MQL-Indicator-Library-Repo-Ready.zip'
      - 'engine.py'
      - 'engine_core.py'
      - 'preview_bridge.py'
      - 'main.js'
      - 'v5.js'
      - 'v54.js'
      - 'index.html'
      - 'styles.css'
      - 'Cargo.toml'
      - 'lib.rs'
      - 'main.rs'
      - 'default.json'
      - 'package.json'
      - 'tauri.conf.json'
      - 'windows/**'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Extract baseline
        shell: pwsh
        run: |
          $work=Join-Path $env:RUNNER_TEMP 'mql-indicator-library-build'
          if(Test-Path $work){Remove-Item -Recurse -Force $work}
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Expand-Archive 'MQL-Indicator-Library-Repo-Ready.zip' $work -Force
          $app=Get-ChildItem $work -Directory | Select-Object -First 1
          if(-not $app){throw 'Baseline app folder missing'}
          "APP_DIR=$($app.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply 0.5.4 source
        shell: pwsh
        run: |
          $r=$env:GITHUB_WORKSPACE
          Set-Location $env:APP_DIR
          Copy-Item "$r/engine.py" 'engine/engine.py' -Force
          Copy-Item "$r/engine_core.py" 'engine/engine_core.py' -Force
          Copy-Item "$r/preview_bridge.py" 'engine/preview_bridge.py' -Force
          Copy-Item "$r/main.js" 'ui/main.js' -Force
          Copy-Item "$r/v5.js" 'ui/v5.js' -Force
          Copy-Item "$r/v54.js" 'ui/v54.js' -Force
          Copy-Item "$r/index.html" 'index.html' -Force
          Copy-Item "$r/styles.css" 'ui/styles.css' -Force
          Copy-Item "$r/Cargo.toml" 'src-tauri/Cargo.toml' -Force
          Copy-Item "$r/lib.rs" 'src-tauri/src/lib.rs' -Force
          Copy-Item "$r/main.rs" 'src-tauri/src/main.rs' -Force
          Copy-Item "$r/default.json" 'src-tauri/capabilities/default.json' -Force
          Copy-Item "$r/package.json" 'package.json' -Force
          Copy-Item "$r/tauri.conf.json" 'src-tauri/tauri.conf.json' -Force
          New-Item -ItemType Directory -Force -Path 'src-tauri/windows' | Out-Null
          Copy-Item "$r/windows/*" 'src-tauri/windows/' -Force

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable

      - name: Validate source
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          python -m py_compile engine/engine.py engine/engine_core.py engine/preview_bridge.py
          node --check ui/main.js
          node --check ui/v5.js
          node --check ui/v54.js
          python engine/preview_bridge.py detect
          if($LASTEXITCODE -ne 0){throw 'Preview detector failed'}

      - name: Build bundled engines
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements-build.txt
          python -m PyInstaller --noconfirm --clean --onefile --name mql-engine --distpath build-sidecar --workpath build-pyinstaller-engine --specpath build-pyinstaller-engine engine/engine.py
          python -m PyInstaller --noconfirm --clean --onefile --name mql-preview --distpath build-sidecar --workpath build-pyinstaller-preview --specpath build-pyinstaller-preview engine/preview_bridge.py
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item build-sidecar/mql-engine.exe src-tauri/binaries/mql-engine-x86_64-pc-windows-msvc.exe -Force
          Copy-Item build-sidecar/mql-preview.exe src-tauri/binaries/mql-preview-x86_64-pc-windows-msvc.exe -Force

      - name: Validate packaged engines
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          $p=& 'build-sidecar/mql-preview.exe' detect 2>&1
          $p | ForEach-Object {Write-Host $_}
          if($LASTEXITCODE -ne 0 -or ($p -join "`n") -notmatch '"ok": true'){throw 'Packaged preview detector failed'}
          $sample=Join-Path $env:RUNNER_TEMP 'mql-unicode'
          New-Item -ItemType Directory -Force -Path $sample | Out-Null
          '#property indicator_chart_window`nint OnInit(){return(INIT_SUCCEEDED);}' | Set-Content "$sample/Unicode_测试_Δ_é.mq4" -Encoding utf8
          $s=& 'build-sidecar/mql-engine.exe' scan --db "$sample/test.sqlite3" --source $sample 2>&1
          $s | ForEach-Object {Write-Host $_}
          if($LASTEXITCODE -ne 0 -or ($s -join "`n") -notmatch 'scan_complete'){throw 'Packaged scanner validation failed'}

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          npm install

      - name: Ensure icon
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          if(-not(Test-Path 'src-tauri/icons/icon.ico')){
            python -m pip install pillow
            New-Item -ItemType Directory -Force -Path 'src-tauri/icons' | Out-Null
            python -c "from PIL import Image,ImageDraw;from pathlib import Path;p=Path(r'src-tauri/icons/icon.ico');im=Image.new('RGBA',(256,256),(24,24,27,255));d=ImageDraw.Draw(im);d.rounded_rectangle((28,28,228,228),radius=44,fill=(37,99,235,255));d.text((78,92),'MQL',fill=(255,255,255,255));im.save(p,format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          npm run tauri build

      - name: Verify installer
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          $i=Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if(-not $i){throw 'Installer missing'}
          if(-not(Test-Path 'src-tauri/binaries/mql-preview-x86_64-pc-windows-msvc.exe')){throw 'Preview sidecar missing'}
          Write-Host "Installer $($i.FullName)"

      - name: Upload finished Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: MQL-Indicator-Library-0.5.4-Windows-Setup
          path: ${{ env.APP_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
