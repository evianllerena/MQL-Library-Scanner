name: Build Windows Beta Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-beta.yml'
      - 'MQL-Indicator-Library-Repo-Ready.zip'
      - 'engine.py'
      - 'engine_core.py'
      - 'preview_bridge.py'
      - 'main.js'
      - 'v5.js'
      - 'index.html'
      - 'styles.css'
      - 'Cargo.toml'
      - 'lib.rs'
      - 'main.rs'
      - 'default.json'
      - 'package.json'
      - 'tauri.conf.json'
      - 'windows/**'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract clean baseline
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "mql-indicator-library-build"
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Expand-Archive -Path "MQL-Indicator-Library-Repo-Ready.zip" -DestinationPath $work -Force
          $app = Get-ChildItem -Path $work -Directory | Select-Object -First 1
          if (-not $app) { throw "Application source folder was not found after extraction." }
          "APP_DIR=$($app.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Application source: $($app.FullName)"

      - name: Apply 0.5.0 source overrides
        shell: pwsh
        run: |
          $repo = $env:GITHUB_WORKSPACE
          Set-Location $env:APP_DIR
          Copy-Item "$repo/engine.py" "engine/engine.py" -Force
          Copy-Item "$repo/engine_core.py" "engine/engine_core.py" -Force
          Copy-Item "$repo/preview_bridge.py" "engine/preview_bridge.py" -Force
          Copy-Item "$repo/main.js" "ui/main.js" -Force
          Copy-Item "$repo/v5.js" "ui/v5.js" -Force
          Copy-Item "$repo/index.html" "index.html" -Force
          Copy-Item "$repo/styles.css" "ui/styles.css" -Force
          Copy-Item "$repo/Cargo.toml" "src-tauri/Cargo.toml" -Force
          Copy-Item "$repo/lib.rs" "src-tauri/src/lib.rs" -Force
          Copy-Item "$repo/main.rs" "src-tauri/src/main.rs" -Force
          Copy-Item "$repo/default.json" "src-tauri/capabilities/default.json" -Force
          Copy-Item "$repo/package.json" "package.json" -Force
          Copy-Item "$repo/tauri.conf.json" "src-tauri/tauri.conf.json" -Force
          New-Item -ItemType Directory -Force -Path "src-tauri/windows" | Out-Null
          Copy-Item "$repo/windows/*" "src-tauri/windows/" -Force
          Write-Host "Applied 0.5.0 Evidence Engine v4, verification memory, outside-click close, and MetaTrader preview source set."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate classifier and UI source
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          python -m py_compile engine/engine.py engine/engine_core.py engine/preview_bridge.py
          node --check ui/main.js
          node --check ui/v5.js
          $sample = Join-Path $env:RUNNER_TEMP "mql-smoke"
          if (Test-Path $sample) { Remove-Item -Recurse -Force $sample }
          New-Item -ItemType Directory -Force -Path $sample | Out-Null
          $sampleLines = @(
            '#property indicator_separate_window',
            '#property indicator_buffers 1',
            'double Buf[];',
            'int OnInit(){ SetIndexBuffer(0,Buf); return(0); }',
            'int OnCalculate(const int rates_total,const int prev_calculated,const datetime &time[],const double &open[],const double &high[],const double &low[],const double &close[],const long &tick_volume[],const long &volume[],const int &spread[]){',
            '  for(int i=0;i<rates_total;i++) Buf[i]=iRSI(NULL,0,14,PRICE_CLOSE,i);',
            '  return(rates_total);',
            '}'
          )
          $sampleLines | Set-Content "$sample/smoke_rsi.mq4" -Encoding utf8
          $sampleLines | Set-Content "$sample/Unicode_测试_Δ_é.mq4" -Encoding utf8
          python engine/engine.py scan --db "$sample/smoke.sqlite3" --source "$sample"
          python engine/engine.py stats --db "$sample/smoke.sqlite3"
          python engine/preview_bridge.py detect
          python engine/preview_bridge.py memory-stats --db "$sample/smoke.sqlite3"
          python -c "import sqlite3,sys; c=sqlite3.connect(r'$sample/smoke.sqlite3'); rows=c.execute('select classifier_version,classification_status from indicators').fetchall(); print(rows); sys.exit(0 if rows and all(r[0]=='evidence-v4' for r in rows) else 1)"

      - name: Build bundled MQL engines
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements-build.txt
          python -m PyInstaller --noconfirm --clean --onefile --name mql-engine --distpath build-sidecar --workpath build-pyinstaller-engine --specpath build-pyinstaller-engine engine/engine.py
          python -m PyInstaller --noconfirm --clean --onefile --name mql-preview --distpath build-sidecar --workpath build-pyinstaller-preview --specpath build-pyinstaller-preview engine/preview_bridge.py
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item build-sidecar/mql-engine.exe src-tauri/binaries/mql-engine-x86_64-pc-windows-msvc.exe -Force
          Copy-Item build-sidecar/mql-preview.exe src-tauri/binaries/mql-preview-x86_64-pc-windows-msvc.exe -Force

      - name: Validate packaged engines
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          $sample = Join-Path $env:RUNNER_TEMP "mql-packaged-unicode"
          if (Test-Path $sample) { Remove-Item -Recurse -Force $sample }
          New-Item -ItemType Directory -Force -Path $sample | Out-Null
          $sampleLines = @(
            '#property indicator_separate_window',
            '#property indicator_buffers 1',
            'double Buf[];',
            'int OnInit(){ SetIndexBuffer(0,Buf); return(0); }',
            'int OnCalculate(const int rates_total,const int prev_calculated,const datetime &time[],const double &open[],const double &high[],const double &low[],const double &close[],const long &tick_volume[],const long &volume[],const int &spread[]){',
            '  for(int i=0;i<rates_total;i++) Buf[i]=iRSI(NULL,0,14,PRICE_CLOSE,i);',
            '  return(rates_total);',
            '}'
          )
          $sampleLines | Set-Content "$sample/Unicode_测试_Δ_é.mq4" -Encoding utf8
          $out = & "build-sidecar/mql-engine.exe" scan --db "$sample/packed.sqlite3" --source "$sample" 2>&1
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "Packaged scanner failed Unicode runtime validation with exit code $LASTEXITCODE" }
          if (($out -join "`n") -match "charmap") { throw "Packaged scanner emitted a charmap encoding failure." }
          if (($out -join "`n") -notmatch "scan_complete") { throw "Packaged scanner did not complete Unicode validation scan." }
          $preview = & "build-sidecar/mql-preview.exe" detect 2>&1
          $preview | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "Packaged MetaTrader preview detector failed." }
          if (($preview -join "`n") -notmatch '"ok": true') { throw "Packaged preview detector returned invalid output." }

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          npm install

      - name: Ensure Windows application icon
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            python -m pip install pillow
            New-Item -ItemType Directory -Force -Path "src-tauri/icons" | Out-Null
            python -c "from PIL import Image,ImageDraw; from pathlib import Path; p=Path(r'src-tauri/icons/icon.ico'); im=Image.new('RGBA',(256,256),(24,24,27,255)); d=ImageDraw.Draw(im); d.rounded_rectangle((28,28,228,228),radius=44,fill=(37,99,235,255)); d.text((78,92),'MQL',fill=(255,255,255,255)); im.save(p,format='ICO',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          }
          if (-not (Test-Path "src-tauri/icons/icon.ico")) { throw "Windows icon generation failed." }

      - name: Build Windows installer
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          npm run tauri build

      - name: Verify installer
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          $installer = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -ErrorAction Stop | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          if (-not (Test-Path "src-tauri/binaries/mql-preview-x86_64-pc-windows-msvc.exe")) { throw "MetaTrader preview sidecar is missing." }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size MB: $([math]::Round($installer.Length / 1MB, 2))"
          if (-not (Test-Path "src-tauri/windows/hooks.nsh")) { throw "Installer hook missing from build source." }

      - name: Upload finished Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: MQL-Indicator-Library-0.5.0-Windows-Setup
          path: ${{ env.APP_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
