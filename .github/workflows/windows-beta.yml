name: Build Windows Beta Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-beta.yml'
      - 'MQL-Indicator-Library-Repo-Ready.zip'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract clean application source
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "mql-indicator-library-build"
          if (Test-Path $work) {
            Remove-Item -Recurse -Force $work
          }
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Expand-Archive -Path "MQL-Indicator-Library-Repo-Ready.zip" -DestinationPath $work -Force
          $app = Get-ChildItem -Path $work -Directory | Select-Object -First 1
          if (-not $app) { throw "Application source folder was not found after extraction." }
          "APP_DIR=$($app.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Application source: $($app.FullName)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build bundled MQL analysis engine
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements-build.txt
          python -m PyInstaller --noconfirm --clean --onefile --name mql-engine --distpath build-sidecar --workpath build-pyinstaller --specpath build-pyinstaller engine/engine.py
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item build-sidecar/mql-engine.exe src-tauri/binaries/mql-engine-x86_64-pc-windows-msvc.exe -Force

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          npm install

      - name: Build Windows installer
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          npm run tauri build

      - name: Verify installer
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          $installer = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -ErrorAction Stop | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size MB: $([math]::Round($installer.Length / 1MB, 2))"

      - name: Upload finished Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: MQL-Indicator-Library-0.2.0-beta.1-Windows-Setup
          path: ${{ env.APP_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
