[package]
name = "mql-indicator-library"
version = "0.5.3"
description = "Local MQ4/MQ5 indicator library and truthful evidence-based classification manager"
authors = ["MQL Indicator Library"]
edition = "2021"

[lib]
name = "mql_indicator_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
