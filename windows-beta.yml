name: Windows Beta Build
on:
  workflow_dispatch:
  push:
    tags: ['beta-*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Python engine sidecar
        shell: pwsh
        run: |
          python -m pip install -r engine/requirements-build.txt
          python -m PyInstaller --noconfirm --clean --onefile --name mql-engine --distpath build-sidecar --workpath build-pyinstaller --specpath build-pyinstaller engine/engine.py
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item build-sidecar/mql-engine.exe src-tauri/binaries/mql-engine-x86_64-pc-windows-msvc.exe
      - name: Install frontend packages
        run: npm install
      - name: Build Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: MQL-Indicator-Library-Windows-Beta
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
